<div class="container-fluid p-0">
  <section class="hero-section d-flex align-items-center">
    <div class="container">
      <div class="row align-items-center min-vh-75 pt-5">
        <div class="col-md-7 text-start fade-in-up">
          <h1 class="display-3 fw-bold">Hi, Im <span class="text-primary">{{ name }}</span></h1>
          <h2 class="typing-container"><span class="typed-text">{{ displayText() }}</span><span class="cursor">|</span>
          </h2>
          <p class="lead mt-4 text-secondary">I'm glad you got this far, I hope to meet you and work together on
            something.
          </p>
          <button (click)="downloadCV()" class="btn btn-outline-primary btn-lg mt-3">
             <fa-icon [icon]="faDownload"></fa-icon> Downloand CV
          </button>
        </div>

        <div class="col-md-5 text-center">
          <div class="profile-blob">
            <img src="imgs/me.png" alt="Foto de perfil" class="img-fluid">
          </div>
        </div>
      </div>
    </div>
  </section>



  <section class="unified-tech-section py-5 bg-dark text-white">
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="display-5 fw-bold">Technical <span class="text-primary">Ecosystem</span></h2>
        <p class="lead text-secondary">A Tech Lead's vision: Seamless integration from code to cloud.</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="tech-box p-4 rounded-4">
            <h3 class="h4 mb-4 text-center"><fa-icon class="p-2" [icon]="faCode"></fa-icon>Core Development</h3>
            <app-swiper-component [items]="techStack" effect="cards">
            </app-swiper-component>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="tech-box p-4 rounded-4">
            <h3 class="h4 mb-4 text-center"><fa-icon class="p-2" [icon]="faMicrosoft"></fa-icon>Azure DevOps & Cloud Strategy</h3>
            <app-swiper-component [items]="azureExperience" effect="coverflow" customClass="azure-swiper">
            </app-swiper-component>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
